<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تحميل السكريبت</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: #1e293b;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    button {
      background: #22c55e;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #16a34a;
    }

    #message {
      margin-top: 18px;
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="image.png" alt="Script Image">

    <h1>My Script</h1>
    <p>اضغط الزر لنسخ السكريبت مباشرة.</p>

    <button onclick="copyScript()">نسخ السكريبت</button>

    <div id="message"></div>
  </div>

  <script>
    async function copyScript() {
      const scriptUrl = "https://raw.githubusercontent.com/alibaydounn9-byte/My-file/main/Note%20speed.txt";

      try {
        const response = await fetch(scriptUrl);
        const text = await response.text();

        await navigator.clipboard.writeText(text);

        document.getElementById("message").innerText = "تم نسخ السكريبت بنجاح ✅";
      } catch (error) {
        document.getElementById("message").innerText = "حدث خطأ أثناء النسخ ❌";
      }
    }
  </script>

</body>
</html>
